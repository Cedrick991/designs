<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Designer Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0a1c;
            --alien-pink: #ff007f;
            --alien-cyan: #00ffff;
            --alien-green: #00ff00;
            --text-yellow: #ffcc00;
            --shadow-magenta: #d81b60; /* Deep blocky magenta */
            --shadow-blue: #0284c7;    /* Deep blocky blue */
        }

        body {
            font-family: 'Press Start 2P', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: white;
            /* Disable scrolling for authentic screen feel */
            overflow: hidden; 
            -webkit-font-smoothing: none; /* Crisper pixel fonts */
        }

        /* Solid 3D Text Shadows */
        .shadow-retro {
            text-shadow: 
                1px 1px 0 var(--shadow-magenta), 
                2px 2px 0 var(--shadow-magenta), 
                3px 3px 0 var(--shadow-magenta), 
                4px 4px 0 var(--shadow-magenta), 
                5px 5px 0 var(--shadow-magenta), 
                6px 6px 0 var(--shadow-magenta), 
                7px 7px 0 var(--shadow-magenta), 
                8px 8px 0 var(--shadow-magenta),
                9px 9px 0 var(--shadow-magenta),
                10px 10px 0 var(--shadow-magenta);
        }

        .shadow-designer {
            text-shadow: 
                1px 1px 0 var(--shadow-blue), 
                2px 2px 0 var(--shadow-blue), 
                3px 3px 0 var(--shadow-blue), 
                4px 4px 0 var(--shadow-blue), 
                5px 5px 0 var(--shadow-blue), 
                6px 6px 0 var(--shadow-blue), 
                7px 7px 0 var(--shadow-blue), 
                8px 8px 0 var(--shadow-blue),
                9px 9px 0 var(--shadow-blue),
                10px 10px 0 var(--shadow-blue);
        }

        /* Hard step blink animation for 8-bit feel */
        @keyframes hard-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .animate-hard-blink {
            animation: hard-blink 1.2s infinite;
        }

        /* Scanlines overlay for CRT monitor effect */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* Base element for the JS-generated starfield */
        #star-layer {
            width: 2px;
            height: 2px;
            background: transparent;
        }
    </style>
</head>
<body class="relative h-screen w-full flex flex-col selection:bg-pink-500 selection:text-white">

    <!-- Procedural Starfield Container -->
    <div id="star-layer" class="absolute top-0 left-0 -z-10"></div>
    
    <!-- CRT Scanline overlay -->
    <div class="absolute inset-0 scanlines"></div>

    <!-- Screen flash overlay for coin insert -->
    <div id="flash-overlay" class="absolute inset-0 bg-white z-50 opacity-0 pointer-events-none transition-opacity duration-75"></div>

    <header class="w-full flex justify-between items-center px-4 md:px-8 py-5 border-b-2 border-white z-20 text-[10px] md:text-sm lg:text-base">
        <!-- 1UP Score -->
        <div class="text-[#ffcc00] tracking-wider">
            1UP 000000
        </div>

        <!-- High Score -->
        <div class="tracking-wider text-center hidden sm:block">
            <span class="text-white">HI-SCORE</span> <span class="text-[#00ffff]">999900</span>
        </div>

        <!-- Coin Counter (Interactive) -->
        <div id="coin-btn" class="text-[#ffcc00] tracking-wider cursor-pointer hover:text-white transition-colors duration-200 select-none group">
            <span class="opacity-70 group-hover:opacity-100">|</span> 
            x<span id="coin-count">00</span>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center relative z-20 px-4 mt-[-5vh]">
        
        <!-- Aliens Container -->
        <div class="flex gap-4 md:gap-8 mb-6">
            <!-- Alien Path: Standard 11x8 grid representation -->
            <svg viewBox="0 0 11 8" class="w-10 h-8 md:w-16 md:h-12 text-[#ff007f]" fill="currentColor" shape-rendering="crispEdges">
                <path d="M2 0h1v1h-1z M8 0h1v1h-1z M3 1h1v1h-1z M7 1h1v1h-1z M2 2h7v1h-7z M1 3h2v1h-2z M4 3h3v1h-3z M8 3h2v1h-2z M0 4h11v1h-11z M0 5h1v1h-1z M2 5h7v1h-7z M10 5h1v1h-1z M0 6h1v1h-1z M2 6h1v1h-1z M8 6h1v1h-1z M10 6h1v1h-1z M3 7h2v1h-2z M6 7h2v1h-2z"/>
            </svg>
            <svg viewBox="0 0 11 8" class="w-10 h-8 md:w-16 md:h-12 text-[#00ffff]" fill="currentColor" shape-rendering="crispEdges">
                <path d="M2 0h1v1h-1z M8 0h1v1h-1z M3 1h1v1h-1z M7 1h1v1h-1z M2 2h7v1h-7z M1 3h2v1h-2z M4 3h3v1h-3z M8 3h2v1h-2z M0 4h11v1h-11z M0 5h1v1h-1z M2 5h7v1h-7z M10 5h1v1h-1z M0 6h1v1h-1z M2 6h1v1h-1z M8 6h1v1h-1z M10 6h1v1h-1z M3 7h2v1h-2z M6 7h2v1h-2z"/>
            </svg>
            <svg viewBox="0 0 11 8" class="w-10 h-8 md:w-16 md:h-12 text-[#00ff00]" fill="currentColor" shape-rendering="crispEdges">
                <path d="M2 0h1v1h-1z M8 0h1v1h-1z M3 1h1v1h-1z M7 1h1v1h-1z M2 2h7v1h-7z M1 3h2v1h-2z M4 3h3v1h-3z M8 3h2v1h-2z M0 4h11v1h-11z M0 5h1v1h-1z M2 5h7v1h-7z M10 5h1v1h-1z M0 6h1v1h-1z M2 6h1v1h-1z M8 6h1v1h-1z M10 6h1v1h-1z M3 7h2v1h-2z M6 7h2v1h-2z"/>
            </svg>
        </div>

        <!-- Copyright -->
        <div class="text-[#00ffff] text-[8px] md:text-[10px] tracking-widest mb-10 text-center">
            © 2026 PLAYER ONE STUDIO
        </div>

        <!-- Title Block -->
        <div class="flex flex-col items-center justify-center gap-4 md:gap-8 mb-12">
            <h1 class="text-[#ffcc00] shadow-retro text-[12vw] sm:text-6xl md:text-8xl lg:text-9xl leading-none uppercase tracking-tighter">
                RETRO
            </h1>
            <h2 class="text-white shadow-designer text-[11vw] sm:text-5xl md:text-7xl lg:text-8xl leading-none uppercase tracking-tight">
                DESIGNER
            </h2>
        </div>

        <!-- Subtitle -->
        <p class="text-gray-300 text-[10px] md:text-sm lg:text-base text-center max-w-3xl leading-[2] md:leading-[2.5]">
            Pixel art, game interfaces & vintage branding - crafted one pixel at a time.
        </p>

        <!-- Hint Text -->
        <p class="text-gray-400 text-[8px] md:text-[10px] mt-16 animate-hard-blink tracking-widest uppercase">
            Tip: click the coin in the top bar ↑
        </p>

    </main>

    <!-- Footer Menu Area -->
    <footer class="absolute bottom-6 left-6 md:bottom-10 md:left-10 z-20 flex items-center gap-3 md:gap-4">
        <!-- Blinking cursor/selector box -->
        <div class="w-3 h-3 md:w-4 md:h-4 bg-[#ff007f] animate-hard-blink"></div>
        <div class="text-white text-xs md:text-sm lg:text-base tracking-widest uppercase">
            CHARACTER SELECT
        </div>
    </footer>

    <script>
        // --- Starfield Generation ---
        function generateStarfield() {
            const starLayer = document.getElementById('star-layer');
            const numStars = window.innerWidth < 768 ? 100 : 250; // Fewer stars on mobile
            const colors = ['#ffffff', '#00ffff', '#ff007f'];
            let boxShadows = [];

            // Calculate dimensions considering the viewport
            const width = window.innerWidth;
            const height = window.innerHeight;

            for (let i = 0; i < numStars; i++) {
                const x = Math.floor(Math.random() * width);
                const y = Math.floor(Math.random() * height);
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                // Add randomly either a 1px or 2px star for slight size variation
                // Box-shadow format: x-offset y-offset blur spread color
                const spread = Math.random() > 0.8 ? '1px' : '0px'; 
                boxShadows.push(`${x}px ${y}px 0 ${spread} ${color}`);
            }

            // Apply the massive box-shadow string to the single 1x1 div
            starLayer.style.boxShadow = boxShadows.join(', ');
        }

        // Generate initially and re-generate on window resize
        generateStarfield();
        window.addEventListener('resize', () => {
            // Debounce slightly to prevent performance hits during active resizing
            clearTimeout(window.starResizeTimer);
            window.starResizeTimer = setTimeout(generateStarfield, 200);
        });

        // --- Coin Interactivity ---
        let coins = 0;
        const coinBtn = document.getElementById('coin-btn');
        const coinDisplay = document.getElementById('coin-count');
        const flashOverlay = document.getElementById('flash-overlay');

        coinBtn.addEventListener('click', () => {
            // Increment coin logic
            coins++;
            // Pad with leading zero if single digit, cap at 99 for classic feel
            const displayValue = Math.min(coins, 99).toString().padStart(2, '0');
            coinDisplay.textContent = displayValue;

            // Trigger Screen Flash
            // 1. Instantly show the white overlay
            flashOverlay.classList.remove('opacity-0', 'duration-75');
            flashOverlay.classList.add('opacity-100', 'duration-0');
            
            // 2. Fade it out quickly after a short delay
            setTimeout(() => {
                flashOverlay.classList.remove('opacity-100', 'duration-0');
                flashOverlay.classList.add('opacity-0', 'duration-300'); // Slightly slower fade out
            }, 50);
        });
    </script>
</body>
</html>
